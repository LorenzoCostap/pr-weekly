name: Snapshot diário do status

on:
  schedule:
    - cron: "0 21 * * 1-5" # seg a sex, 21:00 UTC = 18:00 (Brasília, UTC-3)
  workflow_dispatch: {} # permite rodar manualmente pra testar

permissions:
  contents: write # precisa pra commitar o snapshot de volta no repo

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node src/index-snapshot.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          PROJECT_ORG: ${{ secrets.PROJECT_ORG }}
          PROJECT_NUMBER: ${{ secrets.PROJECT_NUMBER }}
          GITHUB_USERNAME: ${{ secrets.REPORT_GITHUB_USERNAME }}

      - name: Commitar snapshot atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status-log.json
          git diff --cached --quiet && echo "Sem mudanças hoje." || git commit -m "chore: snapshot de status $(date -u +%F)"
          git push
