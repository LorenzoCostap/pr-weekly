name: Relatório semanal de PRs

on:
  schedule:
    - cron: "0 10 * * 2" # terça, 10:00 UTC = 07:00 (Brasília, UTC-3)
  workflow_dispatch: {} # permite rodar manualmente pra testar

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node src/index-report.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_OWNER: ${{ secrets.REPORT_GITHUB_OWNER }}
          GITHUB_REPO: ${{ secrets.REPORT_GITHUB_REPO }}
          GITHUB_USERNAME: ${{ secrets.REPORT_GITHUB_USERNAME }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BOSS_EMAIL: ${{ secrets.BOSS_EMAIL }}
